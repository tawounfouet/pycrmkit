name: Compatibility Matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Compatibility manifest + public smoke
        run: >-
          python -m pytest
          tests/compatibility/test_compatibility_matrix_v1.py
          tests/smoke/test_import.py
          tests/smoke/test_public_api.py
          -q

  persistence:
    name: PostgreSQL ${{ matrix.postgresql }} / SQLAlchemy ${{ matrix.sqlalchemy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgresql: "16"
            sqlalchemy: "2.0"
            sqlalchemy-spec: "SQLAlchemy>=2.0,<2.1"
          - postgresql: "16"
            sqlalchemy: "2.1"
            sqlalchemy-spec: "SQLAlchemy>=2.1,<2.2"
          - postgresql: "17"
            sqlalchemy: "2.0"
            sqlalchemy-spec: "SQLAlchemy>=2.0,<2.1"
          - postgresql: "17"
            sqlalchemy: "2.1"
            sqlalchemy-spec: "SQLAlchemy>=2.1,<2.2"
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: pycrmkit_compat
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_compat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYCRMKIT_TEST_POSTGRES_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_compat
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_compat
      PYCRMKIT_SQLALCHEMY_TEST_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install qualified persistence family
        run: >-
          python -m pip install
          -e ".[postgresql,migrations]"
          "pytest>=8"
          "${{ matrix.sqlalchemy-spec }}"
      - name: Report resolved persistence versions
        run: |
          python - <<'PY'
          import sqlalchemy
          import psycopg
          print("SQLAlchemy", sqlalchemy.__version__)
          print("psycopg", psycopg.__version__)
          PY
      - name: PostgreSQL + migration qualification
        run: >-
          python -m pytest
          -m postgresql
          tests/adapters/postgresql
          tests/migrations
          -q
      - name: SQLAlchemy repository contracts
        run: python -m pytest tests/adapters/sqlalchemy -q

  fastapi:
    name: FastAPI 0.141 / Pydantic 2.13 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install qualified FastAPI family
        run: >-
          python -m pip install
          -e ".[fastapi]"
          "fastapi>=0.141,<0.142"
          "pydantic>=2.13,<2.14"
          "httpx>=0.28,<1"
          "pytest>=8"
      - name: Report resolved transport versions
        run: |
          python - <<'PY'
          import fastapi
          import pydantic
          print("FastAPI", fastapi.__version__)
          print("Pydantic", pydantic.__version__)
          PY
      - run: >-
          python -m pytest tests/integrations/fastapi
          --ignore=tests/integrations/fastapi/test_postgresql_e2e.py
          -q

  django:
    name: Django 5.2 / DRF 3.18 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install qualified Django/DRF family
        run: >-
          python -m pip install
          -e ".[drf]"
          "Django>=5.2,<5.3"
          "djangorestframework>=3.18,<3.19"
          "pytest>=8"
      - name: Report resolved Django versions
        run: |
          python - <<'PY'
          import django
          import rest_framework
          print("Django", django.get_version())
          print("DRF", rest_framework.VERSION)
          PY
      - run: python -m pytest tests/integrations/django -q
      - run: python -m pytest tests/integrations/drf -q

  extras:
    name: Extras / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            extras: ""
            imports: "pycrmkit"
          - name: sqlalchemy
            extras: "sqlalchemy"
            imports: "pycrmkit,sqlalchemy,pycrmkit.storage.sqlalchemy"
          - name: postgresql
            extras: "postgresql"
            imports: "pycrmkit,sqlalchemy,psycopg,pycrmkit.storage.sqlalchemy"
          - name: migrations
            extras: "migrations"
            imports: "pycrmkit,alembic,sqlalchemy,psycopg"
          - name: fastapi
            extras: "fastapi"
            imports: "pycrmkit,fastapi,pydantic,pycrmkit.integrations.fastapi"
          - name: django
            extras: "django"
            imports: "pycrmkit,django,pycrmkit.integrations.django"
          - name: drf
            extras: "drf"
            imports: "pycrmkit,django,rest_framework,pycrmkit.integrations.django.drf"
          - name: email
            extras: "email"
            imports: "pycrmkit,jinja2,pycrmkit.providers.email.jinja2"
          - name: resend
            extras: "resend"
            imports: "pycrmkit,resend,pycrmkit.providers.email.resend"
          - name: fastapi-postgresql-migrations
            extras: "fastapi,postgresql,migrations"
            imports: "pycrmkit,fastapi,pydantic,sqlalchemy,psycopg,alembic"
          - name: django-drf-postgresql
            extras: "django,drf,postgresql"
            imports: "pycrmkit,django,rest_framework,sqlalchemy,psycopg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install optional dependency combination
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          if [ -n "$EXTRAS" ]; then
            python -m pip install -e ".[${EXTRAS}]"
          else
            python -m pip install -e .
          fi
      - name: Import optional dependency combination
        env:
          IMPORTS: ${{ matrix.imports }}
        run: |
          python - <<'PY'
          import importlib
          import os
          import pycrmkit

          modules = os.environ["IMPORTS"].split(",")
          if "pycrmkit.integrations.django.drf" in modules:
              from django.conf import settings

              if not settings.configured:
                  settings.configure(
                      SECRET_KEY="pycrmkit-compatibility-smoke",
                      INSTALLED_APPS=[],
                      USE_TZ=True,
                      REST_FRAMEWORK={"UNAUTHENTICATED_USER": None},
                  )
              import django

              django.setup()

          for module in modules:
              importlib.import_module(module)

          assert pycrmkit.__version__ == "1.0.0b3"
          print("qualified:", os.environ["IMPORTS"])
          PY
