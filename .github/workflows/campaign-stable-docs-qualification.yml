name: Campaign 1.2 Stable Documentation Preparation

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/1.2.0-campaign-metadata-stable]

permissions:
  contents: read

jobs:
  strict-docs-and-contract:
    runs-on: ubuntu-latest
    name: Prepared notes, support boundary and strict MkDocs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install complete candidate for docs and metadata checks
        run: python -m pip install -e ".[dev]"
      - name: Check prepublication support, release and provenance claims
        run: python -m pytest -q tests/compatibility/test_campaign_stable_documentation_gate.py
      - name: Strict documentation build
        run: mkdocs build --strict
      - name: Lint LOT-32-008 documentation contract
        run: |
          ruff check tests/compatibility/test_campaign_stable_documentation_gate.py
          ruff format --check tests/compatibility/test_campaign_stable_documentation_gate.py
