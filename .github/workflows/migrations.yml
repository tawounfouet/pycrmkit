name: Migrations

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pycrmkit_migrations
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[migrations,dev]"
      - run: pytest -m postgresql tests/migrations -q
      - name: Direct Alembic CLI lifecycle
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(os.environ["PYCRMKIT_DATABASE_URL"])
          with engine.begin() as connection:
              connection.exec_driver_sql("DROP SCHEMA IF EXISTS public CASCADE")
              connection.exec_driver_sql("CREATE SCHEMA public")
          engine.dispose()
          PY
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: python -m py_compile migrations/versions/*.py
