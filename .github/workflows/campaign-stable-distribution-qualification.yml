name: Campaign 1.2 Stable Installed Distribution Qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/1.2.0-campaign-metadata-stable, main]

permissions:
  contents: read

jobs:
  isolated-stable-wheel-and-sdist:
    name: Python ${{ matrix.python-version }} / wheel + sdist + checksums
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYCRMKIT_EXPECTED_VERSION: "1.2.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimal build, test and quality tooling
        run: python -m pip install --upgrade pip "build>=1.2" "twine>=6" "pytest>=8" "ruff>=0.6"
      - name: Reject malformed archive metadata and stale release labels
        run: |
          python -m pytest -q tests/compatibility/test_stable_1_2_distribution_manifest.py
          ruff check scripts/stable_1_2_distribution_manifest.py tests/compatibility/test_stable_1_2_distribution_manifest.py
          ruff format --check scripts/stable_1_2_distribution_manifest.py tests/compatibility/test_stable_1_2_distribution_manifest.py
      - name: Build exact source distributions, never publish
        run: |
          python -m build
          python -m twine check dist/*
          mkdir -p candidate
          python scripts/stable_1_2_distribution_manifest.py \
            --dist dist --expected-version "$PYCRMKIT_EXPECTED_VERSION" \
            --output "candidate/stable-1.2.0-manifest-py${{ matrix.python-version }}.json"
      - name: Verify independently calculated candidate archive hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(next(Path("candidate").glob("*.json")).read_text())
          assert manifest["publication_authorized"] is False
          assert manifest["target_stable_version"] == "1.2.0"
          assert manifest["wheel_and_sdist_contents_passed"] is True
          assert len(manifest["files"]) == 2
          for item in manifest["files"]:
              payload = Path("dist") / item["name"]
              assert payload.stat().st_size == item["bytes"]
              assert hashlib.sha256(payload.read_bytes()).hexdigest() == item["sha256"]
          print("Stable 1.2.0 candidate SHA-256 matches actual build bytes")
          PY
      - name: Copy public smoke and DataOps journey outside checkout
        run: |
          mkdir -p /tmp/pycrmkit-1.2-stable-smoke
          cp scripts/v1_production_wheel_smoke.py /tmp/pycrmkit-1.2-stable-smoke/
          cp examples/data_operations/campaign_scenario.py /tmp/pycrmkit-1.2-stable-smoke/
      - name: Core-only wheel AND sdist in separate clean environments
        shell: bash
        run: |
          set -euo pipefail
          for kind in wheel sdist; do
            python -m venv "/tmp/pycrmkit-1.2-core-${{ matrix.python-version }}-$kind"
            VENV="/tmp/pycrmkit-1.2-core-${{ matrix.python-version }}-$kind/bin/python"
            "$VENV" -m pip install --upgrade pip
            if [ "$kind" = wheel ]; then
              SOURCE="$GITHUB_WORKSPACE/dist/pycrmkit-1.2.0-py3-none-any.whl"
            else
              SOURCE="$GITHUB_WORKSPACE/dist/pycrmkit-1.2.0.tar.gz"
            fi
            "$VENV" -m pip install --no-deps "$SOURCE"
            (
              cd /tmp/pycrmkit-1.2-stable-smoke
              PYTHONPATH="" PYCRMKIT_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
                PYCRMKIT_EXPECTED_VERSION="1.2.0" PYCRMKIT_EXPECT_CORE_ONLY=1 \
                "$VENV" -I v1_production_wheel_smoke.py
              PYTHONPATH="" "$VENV" -I campaign_scenario.py
            )
            "$VENV" -m pip check
          done
      - name: Wheel and sdist with full optional extras on Python 3.13
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          EXTRAS="sqlalchemy,postgresql,migrations,fastapi,django,drf,email,resend"
          for kind in wheel sdist; do
            python -m venv "/tmp/pycrmkit-1.2-all-$kind"
            VENV="/tmp/pycrmkit-1.2-all-$kind/bin/python"
            "$VENV" -m pip install --upgrade pip
            if [ "$kind" = wheel ]; then
              SOURCE="$GITHUB_WORKSPACE/dist/pycrmkit-1.2.0-py3-none-any.whl"
            else
              SOURCE="$GITHUB_WORKSPACE/dist/pycrmkit-1.2.0.tar.gz"
            fi
            "$VENV" -m pip install "$SOURCE[$EXTRAS]"
            (
              cd /tmp/pycrmkit-1.2-stable-smoke
              PYTHONPATH="" PYCRMKIT_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
                PYCRMKIT_EXPECTED_VERSION="1.2.0" PYCRMKIT_REQUIRE_OPTIONALS=1 \
                "$VENV" -I v1_production_wheel_smoke.py
              PYTHONPATH="" "$VENV" -I campaign_scenario.py
            )
            "$VENV" -m pip check
          done
      - name: Save candidate evidence ONLY — never tag/release/PyPI
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: campaign-1.2-stable-CANDIDATE-NOT-PUBLISHED
          path: |
            dist/pycrmkit-1.2.0-py3-none-any.whl
            dist/pycrmkit-1.2.0.tar.gz
            candidate/stable-1.2.0-manifest-py3.13.json
          if-no-files-found: error
