name: Track S - Installed Feature Tours

on:
  pull_request:
    paths:
      - "src/pycrmkit/_feature_tours/**"
      - "src/pycrmkit/_feature_tours_loader.py"
      - "src/pycrmkit/cli/commands/tours.py"
      - "examples/feature_tours/**"
      - "tests/unit/cli/test_feature_tours_installed.py"
      - "pyproject.toml"
      - ".github/workflows/track-s-installed-feature-tours.yml"
  workflow_dispatch:

jobs:
  installed-wheel-tours:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build isolated wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel with CLI extra and check resources
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[cli]"
          python -m pip show -f pycrmkit
      - name: Execute all tours away from source checkout
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          unset PYTHONPATH
          python -c "import pycrmkit; print(pycrmkit.__version__)"
          pck tours
          pck demo --tour 1
          pck tours --tour 6
          pck tours --tour '__invalid__' && exit 1 || test $? -eq 2
