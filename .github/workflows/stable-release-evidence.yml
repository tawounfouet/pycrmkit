name: Stable Release Evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  stable-evidence:
    name: 1.0.0 stable artifacts + SHA256 evidence
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1790523711"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release toolchain
        run: python -m pip install --upgrade pip "build>=1.2" "twine>=6"
      - name: Assert stable package version
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import pycrmkit
          assert pycrmkit.__version__ == "1.0.0"
          print(pycrmkit.__version__)
          PY
      - name: Build stable artifacts
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          test -f dist/pycrmkit-1.0.0-py3-none-any.whl
          test -f dist/pycrmkit-1.0.0.tar.gz
      - name: Normalize sdist archive metadata
        run: |
          python scripts/normalize_release_sdist.py dist/pycrmkit-1.0.0.tar.gz
          python -m twine check dist/*
      - name: Generate stable SHA256 evidence
        run: |
          sha256sum             dist/pycrmkit-1.0.0-py3-none-any.whl             dist/pycrmkit-1.0.0.tar.gz             | sed 's#  dist/#  #'             | tee /tmp/SHA256SUMS-v1.0.0.txt
          echo "----- STABLE SHA256 BEGIN -----"
          cat /tmp/SHA256SUMS-v1.0.0.txt
          echo "----- STABLE SHA256 END -----"
      - name: Verify stable rebuild is byte-for-byte reproducible
        run: |
          cp /tmp/SHA256SUMS-v1.0.0.txt /tmp/SHA256SUMS-v1.0.0-first.txt
          rm -rf dist build
          python -m build
          python scripts/normalize_release_sdist.py dist/pycrmkit-1.0.0.tar.gz
          python -m twine check dist/*
          sha256sum             dist/pycrmkit-1.0.0-py3-none-any.whl             dist/pycrmkit-1.0.0.tar.gz             | sed 's#  dist/#  #'             | tee /tmp/SHA256SUMS-v1.0.0-second.txt
          diff -u /tmp/SHA256SUMS-v1.0.0-first.txt /tmp/SHA256SUMS-v1.0.0-second.txt
          cp /tmp/SHA256SUMS-v1.0.0-second.txt /tmp/SHA256SUMS-v1.0.0.txt
      - name: Verify frozen stable checksums
        run: |
          diff -u release/SHA256SUMS-v1.0.0.txt /tmp/SHA256SUMS-v1.0.0.txt
          (
            cd dist
            sha256sum -c ../release/SHA256SUMS-v1.0.0.txt
          )
      - name: Stable promotion contract
        run: |
          python -m pip install -e ".[dev]"
          python scripts/v1_production_gate.py
          python scripts/v1_stable_release_gate.py
          python -m pytest tests/qualification -m "not postgresql" -q
      - name: Isolated stable wheel smoke
        run: |
          cp scripts/v1_production_wheel_smoke.py /tmp/v1_production_wheel_smoke.py
          python -m venv /tmp/pycrmkit-v1-stable-wheel
          /tmp/pycrmkit-v1-stable-wheel/bin/python -m pip install --upgrade pip
          /tmp/pycrmkit-v1-stable-wheel/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE/dist/pycrmkit-1.0.0-py3-none-any.whl"
          cd /tmp
          PYTHONPATH=""           PYCRMKIT_REPOSITORY_ROOT="$GITHUB_WORKSPACE"           PYCRMKIT_EXPECTED_VERSION="1.0.0"           PYCRMKIT_EXPECT_CORE_ONLY=1           /tmp/pycrmkit-v1-stable-wheel/bin/python /tmp/v1_production_wheel_smoke.py
      - name: Isolated stable sdist smoke
        run: |
          python -m venv /tmp/pycrmkit-v1-stable-sdist
          /tmp/pycrmkit-v1-stable-sdist/bin/python -m pip install --upgrade pip
          /tmp/pycrmkit-v1-stable-sdist/bin/python -m pip install "$GITHUB_WORKSPACE/dist/pycrmkit-1.0.0.tar.gz"
          cd /tmp
          PYTHONPATH=""           PYCRMKIT_REPOSITORY_ROOT="$GITHUB_WORKSPACE"           PYCRMKIT_EXPECTED_VERSION="1.0.0"           PYCRMKIT_EXPECT_CORE_ONLY=1           /tmp/pycrmkit-v1-stable-sdist/bin/python /tmp/v1_production_wheel_smoke.py
      - name: Stage stable evidence bundle
        run: |
          mkdir -p /tmp/pycrmkit-v1-stable-evidence
          cp dist/* /tmp/pycrmkit-v1-stable-evidence/
          cp /tmp/SHA256SUMS-v1.0.0.txt /tmp/pycrmkit-v1-stable-evidence/
          cp release/qualification-report-v1.0.0.json /tmp/pycrmkit-v1-stable-evidence/
          cp release/release-manifest-v1.0.0.json /tmp/pycrmkit-v1-stable-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: pycrmkit-v1.0.0-stable-evidence
          path: /tmp/pycrmkit-v1-stable-evidence/*
          if-no-files-found: error
