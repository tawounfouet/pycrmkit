name: Campaign 1.2 Stable Reference Host Qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/1.2.0-campaign-metadata-stable]

permissions:
  contents: read

jobs:
  reference-host:
    name: Installed wheel and signed reference host / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: pycrmkit_stable_host
          POSTGRES_USER: pycrmkit
          # One-job disposable CI container only; NOT a production DB setting.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_stable_host"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit@localhost:5432/pycrmkit_stable_host
      PYCRMKIT_EXPECTED_VERSION: "1.2.0rc1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build source artifacts and verify dist metadata
        run: |
          python -m pip install --upgrade pip "build>=1.2" "twine>=6"
          python -m build
          python -m twine check dist/*
      - name: Install the wheel into a clean venv outside source tree
        shell: bash
        run: |
          python -m venv /tmp/pycrmkit-stable-host-venv
          /tmp/pycrmkit-stable-host-venv/bin/python -m pip install --upgrade pip
          wheel="$GITHUB_WORKSPACE/dist/pycrmkit-$PYCRMKIT_EXPECTED_VERSION-py3-none-any.whl"
          /tmp/pycrmkit-stable-host-venv/bin/python -m pip install \
            "$wheel[fastapi,postgresql,migrations]" "httpx>=0.28,<1"
          /tmp/pycrmkit-stable-host-venv/bin/python -m pip check
      - name: Run wheel-provided Alembic migrations and assert head
        shell: bash
        run: |
          set -euo pipefail
          (
            cd /tmp
            PYTHONPATH="" /tmp/pycrmkit-stable-host-venv/bin/pycrmkit-migrate upgrade head
            PYTHONPATH="" /tmp/pycrmkit-stable-host-venv/bin/pycrmkit-migrate current
            PYTHONPATH="" /tmp/pycrmkit-stable-host-venv/bin/pycrmkit-migrate check
          )
          /tmp/pycrmkit-stable-host-venv/bin/python - <<'PY'
          import os
          import psycopg
          connect_url = os.environ["PYCRMKIT_DATABASE_URL"].replace(
              "postgresql+psycopg://", "postgresql://", 1
          )
          with psycopg.connect(connect_url) as db:
              version = db.execute("SELECT version_num FROM alembic_version").fetchone()
          assert version == ("0006",), version
          print("Verified installed wheel migrated to Alembic head 0006")
          PY
      - name: Isolate reference host application and test scenarios from checkout
        shell: bash
        run: |
          mkdir -p /tmp/pycrmkit-stable-host-sandbox
          cp examples/campaign_rc_host/host_app.py /tmp/pycrmkit-stable-host-sandbox/
          cp examples/campaign_rc_host/scenario.py /tmp/pycrmkit-stable-host-sandbox/
          cp examples/campaign_rc_host/stable_scenario.py /tmp/pycrmkit-stable-host-sandbox/
      - name: Requalify original RC signed-host journey and restart
        shell: bash
        run: |
          # The signer is session-local: do not pass secrets via GITHUB_ENV.
          export PYCRMKIT_RC_HOST_SIGNING_KEY="$(python -c 'import secrets; print(secrets.token_hex(48))')"
          (
            cd /tmp/pycrmkit-stable-host-sandbox
            PYTHONPATH="" /tmp/pycrmkit-stable-host-venv/bin/python scenario.py
          )
      - name: Qualify stable negative, replay, privacy and restart journeys
        shell: bash
        run: |
          export PYCRMKIT_RC_HOST_SIGNING_KEY="$(python -c 'import secrets; print(secrets.token_hex(48))')"
          (
            cd /tmp/pycrmkit-stable-host-sandbox
            PYTHONPATH="" /tmp/pycrmkit-stable-host-venv/bin/python stable_scenario.py
          )
      - name: Validate source-only pure Python compatibility with frozen RC
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q examples/campaign_rc_host/test_stable_claims.py \
            tests/integrations/fastapi/test_campaign_host_scope_rc.py \
            tests/integrations/drf/test_campaign_host_scope_rc.py
          ruff check examples/campaign_rc_host/stable_scenario.py
          ruff format --check examples/campaign_rc_host/stable_scenario.py
