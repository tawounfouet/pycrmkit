name: Persistence Qualification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  persistence-rc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pycrmkit_rc
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_rc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYCRMKIT_TEST_POSTGRES_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc
      PYCRMKIT_SQLALCHEMY_TEST_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,migrations,postgresql]"

      - name: Stable 0.1-0.5 facade and PostgreSQL qualification
        run: pytest -m postgresql tests/adapters/postgresql tests/persistence -q

      - name: Repository conformance on PostgreSQL
        run: pytest tests/adapters/sqlalchemy -q

      - name: Migration chain qualification
        run: pytest -m postgresql tests/migrations -q

      - name: Build release artifacts
        run: python -m build

      - name: Prepare migrated database for installed-wheel smoke
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(os.environ["PYCRMKIT_TEST_POSTGRES_URL"])
          with engine.begin() as connection:
              connection.exec_driver_sql("DROP SCHEMA IF EXISTS public CASCADE")
              connection.exec_driver_sql("CREATE SCHEMA public")
          engine.dispose()
          PY
          alembic upgrade head

      - name: Install wheel in clean environment
        shell: bash
        run: |
          python -m venv .venv-wheel-smoke
          .venv-wheel-smoke/bin/python -m pip install --upgrade pip
          wheel="$(ls dist/pycrmkit-*.whl)"
          .venv-wheel-smoke/bin/python -m pip install "${wheel}[postgresql]"

      - name: Installed-wheel + PostgreSQL smoke
        env:
          PYTHONPATH: ""
        run: .venv-wheel-smoke/bin/python scripts/postgresql_wheel_smoke.py
