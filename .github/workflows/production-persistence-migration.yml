name: Production Persistence & Migrations

on:
  push:
    branches: [main]
  pull_request:

jobs:
  persistence-migrations:
    name: V1 PostgreSQL + migration qualification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pycrmkit_v1_rc03
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_v1_rc03"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYCRMKIT_TEST_POSTGRES_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_v1_rc03
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_v1_rc03
      PYCRMKIT_SQLALCHEMY_TEST_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_v1_rc03

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --upgrade pip

      - name: Install persistence qualification stack
        run: python -m pip install -e ".[dev,migrations,postgresql]"

      - name: V1 persistence + merge atomicity qualification
        run: python -m pytest -m postgresql tests/qualification/test_v1_persistence_migration_qualification.py -q

      - name: Stable persistence regression
        run: python -m pytest -m postgresql tests/persistence/test_persistence_release_candidate.py -q

      - name: Full migration-chain regression
        run: python -m pytest -m postgresql tests/migrations -q

      - name: Repository conformance regression
        run: python -m pytest tests/adapters/sqlalchemy -q

      - name: Build release artifacts
        run: python -m build

      - name: Reset PostgreSQL for installed-wheel qualification
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(os.environ["PYCRMKIT_TEST_POSTGRES_URL"])
          with engine.begin() as connection:
              connection.exec_driver_sql("DROP SCHEMA IF EXISTS public CASCADE")
              connection.exec_driver_sql("CREATE SCHEMA public")
          engine.dispose()
          PY

      - name: Install wheel with migration dependencies
        shell: bash
        run: |
          python -m venv .venv-v1-rc03
          .venv-v1-rc03/bin/python -m pip install --upgrade pip
          wheel="$(ls dist/pycrmkit-*.whl)"
          .venv-v1-rc03/bin/python -m pip install "${wheel}[migrations]"

      - name: Apply packaged migrations
        env:
          PYTHONPATH: ""
        shell: bash
        run: |
          .venv-v1-rc03/bin/pycrmkit-migrate upgrade head
          .venv-v1-rc03/bin/pycrmkit-migrate current
          .venv-v1-rc03/bin/pycrmkit-migrate check

      - name: Installed-wheel PostgreSQL smoke
        env:
          PYTHONPATH: ""
        run: .venv-v1-rc03/bin/python scripts/postgresql_wheel_smoke.py
