name: Publish PyCRMKit v1.2.0b3 (GitHub prerelease)

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v1.2.0b3.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pycrmkit-v1.2.0b3-github-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tawounfouet/pycrmkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: 76aff8231ee4fe824088951af2e9ce20a0c54f68
      TAG: v1.2.0b3
      RUN_ID: "40763215723"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm immutable qualified source and diff scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" "$GITHUB_SHA"
          git diff --name-only "$TARGET_SHA" "$GITHUB_SHA" > /tmp/changes.txt
          diff -u <(printf '%s\n' '.github/workflows/publish-v1.2.0b3.yml') /tmp/changes.txt
          grep -Fq '1.2.0b3' <(git show "$TARGET_SHA:src/pycrmkit/__about__.py")

      - name: Verify 24 completed successful main workflows on target SHA
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = ("https://api.github.com/repos/tawounfouet/pycrmkit/actions/runs"
                 f"?head_sha={os.environ['TARGET_SHA']}&per_page=100")
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response)["workflow_runs"]
          selected = [r for r in runs if r["head_sha"] == os.environ["TARGET_SHA"]
                      and r["head_branch"] == "main" and r["event"] == "push"]
          assert len(selected) == 24, len(selected)
          assert all(r["status"] == "completed" and r["conclusion"] == "success"
                     for r in selected), [(r["name"], r["conclusion"]) for r in selected]
          PY

      - name: Retrieve and verify qualified wheel and sdist bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$TARGET_SHA"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          mkdir dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name pycrmkit-v1-rc05-distributions --dir dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          WHEEL_SHA="$(sha256sum dist/pycrmkit-1.2.0b3-py3-none-any.whl | awk '{print $1}')"
          SDIST_SHA="$(sha256sum dist/pycrmkit-1.2.0b3.tar.gz | awk '{print $1}')"
          printf 'WHEEL_SHA=%s\nSDIST_SHA=%s\n' "$WHEEL_SHA" "$SDIST_SHA" >> "$GITHUB_ENV"
          printf '%s  %s\n' \
            "$WHEEL_SHA" "pycrmkit-1.2.0b3-py3-none-any.whl" \
            "$SDIST_SHA" "pycrmkit-1.2.0b3.tar.gz" > dist/SHA256SUMS-v1.2.0b3.txt
          ( cd dist && sha256sum -c SHA256SUMS-v1.2.0b3.txt )

      - name: Inspect artifact metadata and packaged Django migrations
        run: |
          python - <<'PY'
          import tarfile, zipfile
          with zipfile.ZipFile('dist/pycrmkit-1.2.0b3-py3-none-any.whl') as f:
              assert f.testzip() is None
              names = set(f.namelist())
              assert 'Version: 1.2.0b3' in f.read('pycrmkit-1.2.0b3.dist-info/METADATA').decode()
              for x in ('0004_campaign_persistence', '0005_communication_record_store'):
                  assert f'pycrmkit/integrations/django/migrations/{x}.py' in names
          with tarfile.open('dist/pycrmkit-1.2.0b3.tar.gz') as f:
              names = set(f.getnames())
              for x in ('0004_campaign_persistence', '0005_communication_record_store'):
                  assert f'pycrmkit-1.2.0b3/src/pycrmkit/integrations/django/migrations/{x}.py' in names
          PY

      - name: Prepare provenance and release notes
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          manifest = {
              'project': 'pycrmkit', 'version': '1.2.0b3',
              'tag': 'v1.2.0b3', 'source_sha': os.environ['TARGET_SHA'],
              'qualified_main_workflows': 24, 'build_run': int(os.environ['RUN_ID']),
              'artifacts': [
                  {'name': 'pycrmkit-1.2.0b3-py3-none-any.whl', 'sha256': os.environ['WHEEL_SHA']},
                  {'name': 'pycrmkit-1.2.0b3.tar.gz', 'sha256': os.environ['SDIST_SHA']},
              ],
              'generated_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'pypi_publication': 'not verified',
          }
          Path('dist/release-manifest-v1.2.0b3.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          git show "$TARGET_SHA:docs/releases/1.2.0b3.md" \
            | sed -n '/^## Overview/,$p' | sed '/^## Evidence and release gates/,$d' > /tmp/summary.md
          {
            printf '# PyCRMKit v1.2.0b3 - HTTP + Data Operations Integration\n\n'
            printf 'Beta prerelease. Qualified source SHA: %s.\n\n' "$TARGET_SHA"
            cat /tmp/summary.md
            printf '\nMain checks: 24/24. Build run: %s. SHA256SUMS attached.\n' "$RUN_ID"
            printf 'PyPI publication is separate and not implied.\n'
          } > /tmp/notes.md

      - name: Tag exactly qualified SHA without replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$TARGET_SHA"
          else
            git tag -a "$TAG" "$TARGET_SHA" -m 'PyCRMKit 1.2.0b3 HTTP + Data Operations Integration'
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub prerelease and verified binary files
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release cannot be overwritten'
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease \
            --title 'PyCRMKit v1.2.0b3 - HTTP + Data Operations Integration' \
            --notes-file /tmp/notes.md \
            dist/pycrmkit-1.2.0b3-py3-none-any.whl \
            dist/pycrmkit-1.2.0b3.tar.gz \
            dist/SHA256SUMS-v1.2.0b3.txt \
            dist/release-manifest-v1.2.0b3.json

      - name: Verify release downloaded artifacts
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'pycrmkit-1.2.0b3*' --pattern 'SHA256SUMS-v1.2.0b3.txt' --dir verify
          ( cd verify && sha256sum -c SHA256SUMS-v1.2.0b3.txt )
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
