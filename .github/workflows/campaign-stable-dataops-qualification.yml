name: Campaign 1.2 Stable DataOps Qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/1.2.0-campaign-metadata-stable]

permissions:
  contents: read

jobs:
  campaign-dataops-contracts:
    name: Campaign DataOps replay/privacy/spreadsheet Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development and integration dependencies
        run: python -m pip install -e ".[dev]"
      - name: Source import/export and stable security qualification
        run: |
          python -m pytest -q \
            tests/qualification/test_campaign_stable_dataops_gate.py \
            tests/qualification/test_campaign_import_rc.py \
            tests/qualification/test_campaign_export_rc.py \
            tests/integrations/test_campaign_dataops_import.py \
            tests/integrations/test_campaign_dataops_export.py
      - name: Ruff stable gate and spreadsheet consumer example
        run: |
          ruff check tests/qualification/test_campaign_stable_dataops_gate.py examples/data_operations/campaign_csv_spreadsheet_guard.py
          ruff format --check tests/qualification/test_campaign_stable_dataops_gate.py

  installed-wheel-dataops:
    name: Installed core-only wheel Campaign import/export smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and isolate core-only wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel --outdir dist-stable-dataops
          python -m venv /tmp/pycrmkit-dataops-core
          /tmp/pycrmkit-dataops-core/bin/python -m pip install --no-deps dist-stable-dataops/pycrmkit-*.whl
      - name: Run imports and exports away from source checkout
        shell: bash
        run: |
          set -euo pipefail
          (
            cd /tmp
            PYTHONPATH="" /tmp/pycrmkit-dataops-core/bin/python -I - <<'PY'
          import io
          import json
          import pycrmkit
          from pycrmkit import CRM
          from pycrmkit.campaigns import export_campaign_records, import_campaign_members
          from pycrmkit.importers import JSONReader

          assert "/tmp/pycrmkit-dataops-core/" in pycrmkit.__file__
          crm = CRM.memory(webhook_auto_delivery=False)
          person = crm.contacts.create(display_name="Wheel")
          campaign = crm.campaigns.create(key="stable-wheel-dataops", name="Wheel")
          report = import_campaign_members(
              crm.campaigns, campaign.id,
              JSONReader(io.StringIO(json.dumps([
                  {"entity_kind": "contact", "entity_id": str(person.id)}
              ]))),
          )
          assert report.rows_created == 1
          output = io.StringIO()
          assert export_campaign_records(
              crm.campaigns, campaign.id, output, kind="audience", format="jsonl",
          ) == 1
          assert json.loads(output.getvalue())["entity_id"] == str(person.id)
          print("Core-only wheel DataOps stable qualification: PASS")
          PY
          )
