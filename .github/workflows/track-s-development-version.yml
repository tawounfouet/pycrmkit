name: Track S - Development Version and Artifact Identity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  development-identity:
    name: PEP 440 / wheel / CLI - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling and tests
        run: python -m pip install --upgrade "build>=1.2" "twine>=6" "pytest>=8"
      - name: Build development artifacts without publishing
        run: |
          python -m build
          python -m twine check dist/*
      - name: Inspect exact metadata and installed CLI outside source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/pycrmkit-1.3.0.dev0-py3-none-any.whl
          test -f dist/pycrmkit-1.3.0.dev0.tar.gz
          python -m venv /tmp/pycrmkit-track-s-version
          /tmp/pycrmkit-track-s-version/bin/python -m pip install --upgrade pip
          /tmp/pycrmkit-track-s-version/bin/python -m pip install "$GITHUB_WORKSPACE/dist/pycrmkit-1.3.0.dev0-py3-none-any.whl[cli]"
          (
            cd /tmp
            PYTHONPATH="" /tmp/pycrmkit-track-s-version/bin/python - <<'PY'
          import importlib.metadata as metadata
          import pycrmkit
          assert pycrmkit.__version__ == "1.3.0.dev0"
          assert metadata.version("pycrmkit") == pycrmkit.__version__
          assert "cli" in metadata.distribution("pycrmkit").metadata.get_all("Provides-Extra", [])
          print("Installed wheel metadata: development identity qualified")
          PY
            PYTHONPATH="" /tmp/pycrmkit-track-s-version/bin/pck version --json > /tmp/version.json
            PYTHONPATH="" /tmp/pycrmkit-track-s-version/bin/pycrm version --json > /tmp/version-alias.json
            /tmp/pycrmkit-track-s-version/bin/python - <<'PY'
          import json
          for path in ("/tmp/version.json", "/tmp/version-alias.json"):
              with open(path, encoding="utf-8") as stream:
                  assert json.load(stream)["pycrmkit"]["version"] == "1.3.0.dev0"
          print("pck and pycrm development CLI versions: PASS")
          PY
          )
          /tmp/pycrmkit-track-s-version/bin/python -m pip check
      - name: Source-side history and development invariants
        run: python -m pytest -q tests/qualification/test_track_s_release_identity.py
