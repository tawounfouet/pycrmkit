name: Migration Baseline Generation

on:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pycrmkit_migration
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[migrations]"
      - name: Generate immutable baseline candidate
        run: |
          test -z "$(find migrations/versions -maxdepth 1 -name '*.py' -print -quit)"
          alembic revision --autogenerate --rev-id 0001 -m "persistence baseline"
      - uses: actions/upload-artifact@v4
        with:
          name: alembic-baseline
          path: migrations/versions/*.py
