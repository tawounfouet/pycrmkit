name: Migration Baseline Generation

on:
  pull_request:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pycrmkit_migration
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[migrations]"
      - name: Generate and commit immutable baseline
        shell: bash
        run: |
          if find migrations/versions -maxdepth 1 -name '*.py' -print -quit | grep -q .; then
            echo "Baseline already committed; nothing to generate."
            exit 0
          fi

          alembic revision --autogenerate --rev-id 0001 -m "persistence baseline"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/versions/*.py
          git commit -m "feat(migrations): add immutable persistence baseline"
          git push origin "HEAD:${{ github.head_ref }}"
