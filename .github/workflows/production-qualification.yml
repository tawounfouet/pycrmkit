name: Production Qualification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: RC-06 / Core governance and cross-layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Qualification contracts
        run: python -m pytest tests/qualification -m "not postgresql" -q
      - name: V1 governance regressions
        run: |
          python -m pytest tests/compatibility/test_public_api_v1_candidate.py -q
          python -m pytest tests/compatibility/test_compatibility_matrix_v1.py -q
          python -m pytest tests/security -q
          python -m pytest tests/performance tests/unit/importers/test_pipeline.py -q
      - name: V1 system journeys
        run: |
          python -m pytest tests/e2e/test_v1_production_qualification.py -q
          python -m pytest tests/e2e/test_data_operations_rc.py -q
      - name: Static and documentation quality
        run: |
          ruff check .
          mypy src/pycrmkit
          mkdocs build --strict
      - name: Executable gate contract
        run: python scripts/v1_production_gate.py

  persistence:
    name: RC-06 / PostgreSQL transactions and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pycrmkit_rc06_persistence
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_rc06_persistence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYCRMKIT_TEST_POSTGRES_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc06_persistence
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc06_persistence
      PYCRMKIT_SQLALCHEMY_TEST_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc06_persistence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgresql,migrations]"
      - run: python -m pytest -m postgresql tests/qualification/test_v1_persistence_migration_qualification.py -q
      - run: python -m pytest -m postgresql tests/persistence/test_persistence_release_candidate.py -q
      - run: python -m pytest -m postgresql tests/migrations -q
      - run: python -m pytest tests/adapters/sqlalchemy -q

  fastapi:
    name: RC-06 / FastAPI to CRM to PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pycrmkit_rc06_fastapi
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_rc06_fastapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYCRMKIT_TEST_POSTGRES_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc06_fastapi
      PYCRMKIT_DATABASE_URL: postgresql+psycopg://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc06_fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,fastapi,postgresql,migrations]"
      - run: python -m pytest tests/qualification/test_v1_integration_qualification.py -q
      - run: python -m pytest tests/integrations/fastapi -m "not postgresql" -q
      - run: python -m pytest -m postgresql tests/integrations/fastapi/test_postgresql_e2e.py -q

  django:
    name: RC-06 / Django and DRF to CRM to PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pycrmkit_rc06_django
          POSTGRES_USER: pycrmkit
          POSTGRES_PASSWORD: pycrmkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pycrmkit -d pycrmkit_rc06_django"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYCRMKIT_DATABASE_URL: postgresql://pycrmkit:pycrmkit@localhost:5432/pycrmkit_rc06_django
      DJANGO_SECRET_KEY: pycrmkit-rc06
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,django,drf,postgresql]"
      - run: python examples/django/manage.py migrate --noinput
      - run: python examples/django/manage.py makemigrations pycrmkit_crm --check --dry-run
      - run: python -m pytest tests/integrations/django -q
      - run: python -m pytest tests/integrations/drf -q
      - name: Cross-process Django journey
        run: |
          state="$(mktemp)"
          python examples/django/smoke.py seed --state "$state"
          python examples/django/smoke.py verify --state "$state"

  artifacts:
    name: RC-06 / Installed distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip "build>=1.2" "twine>=6"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: cp scripts/v1_production_wheel_smoke.py /tmp/v1_production_wheel_smoke.py
      - name: Core wheel
        run: |
          python -m venv /tmp/rc06-core-wheel
          /tmp/rc06-core-wheel/bin/python -m pip install --upgrade pip
          /tmp/rc06-core-wheel/bin/python -m pip install --no-deps "$GITHUB_WORKSPACE/dist/pycrmkit-1.1.0b3-py3-none-any.whl"
          cd /tmp
          PYTHONPATH="" PYCRMKIT_REPOSITORY_ROOT="$GITHUB_WORKSPACE" PYCRMKIT_EXPECT_CORE_ONLY=1 /tmp/rc06-core-wheel/bin/python /tmp/v1_production_wheel_smoke.py
      - name: Full-extra wheel
        run: |
          python -m venv /tmp/rc06-full-wheel
          /tmp/rc06-full-wheel/bin/python -m pip install --upgrade pip
          /tmp/rc06-full-wheel/bin/python -m pip install "$GITHUB_WORKSPACE/dist/pycrmkit-1.1.0b3-py3-none-any.whl[sqlalchemy,postgresql,migrations,fastapi,django,drf,email,resend]"
          cd /tmp
          PYTHONPATH="" PYCRMKIT_REPOSITORY_ROOT="$GITHUB_WORKSPACE" PYCRMKIT_REQUIRE_OPTIONALS=1 /tmp/rc06-full-wheel/bin/python /tmp/v1_production_wheel_smoke.py
          PYTHONPATH="" /tmp/rc06-full-wheel/bin/pycrmkit-migrate --help
          /tmp/rc06-full-wheel/bin/python -m pip check
      - name: Source distribution
        run: |
          python -m venv /tmp/rc06-sdist
          /tmp/rc06-sdist/bin/python -m pip install --upgrade pip
          /tmp/rc06-sdist/bin/python -m pip install "$GITHUB_WORKSPACE/dist/pycrmkit-1.1.0b3.tar.gz"
          cd /tmp
          PYTHONPATH="" PYCRMKIT_REPOSITORY_ROOT="$GITHUB_WORKSPACE" PYCRMKIT_EXPECT_CORE_ONLY=1 /tmp/rc06-sdist/bin/python /tmp/v1_production_wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: pycrmkit-rc06-candidate-distributions
          path: dist/*

  production-release-gate:
    name: RC-06 / ZERO BLOCKERS
    needs: [core, persistence, fastapi, django, artifacts]
    runs-on: ubuntu-latest
    steps:
      - run: echo "PyCRMKit RC-06 production release gate - ZERO BLOCKERS"
