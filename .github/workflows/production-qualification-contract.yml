name: Production Qualification Contract

on:
  push:
    branches: [main]
    paths:
      - "tests/qualification/**"
      - ".github/workflows/production-qualification-contract.yml"
  pull_request:
    paths:
      - "tests/qualification/**"
      - ".github/workflows/production-qualification-contract.yml"

jobs:
  contract:
    name: V1 production qualification contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate machine-readable RC contract
        run: python -m pytest tests/qualification -q
