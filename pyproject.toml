[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycrmkit"
dynamic = ["version"]
description = "Headless CRM building blocks for Python applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Awounfouet" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=4",
  "build>=1.2",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/tawounfouet/pycrmkit"
Repository = "https://github.com/tawounfouet/pycrmkit"
Issues = "https://github.com/tawounfouet/pycrmkit/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pycrmkit.__about__.__version__"}

[tool.setuptools.package-data]
pycrmkit = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "PYI"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pycrmkit"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["pycrmkit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
